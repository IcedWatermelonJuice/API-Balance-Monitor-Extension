<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API Balance Monitor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="popup-body">
  <main class="popup-shell">
    <header class="popup-header">
      <div class="brand-wrap">
        <img src="icons/icon48.png" class="brand-icon" alt="" />
        <div class="brand-copy">
          <h1 data-i18n="appName">API 余额监测</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="language-control">
          <button class="language-trigger" data-language-trigger type="button" aria-haspopup="menu" aria-expanded="false" aria-label="语言">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
            <span data-language-code>CN</span>
          </button>
          <div class="language-menu hidden" role="menu">
            <button class="language-option" data-language-option="auto" role="menuitemradio" type="button"><span class="language-region">AUTO</span><span data-i18n="followBrowser">跟随浏览器</span><svg class="language-check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
            <button class="language-option" data-language-option="zh-CN" role="menuitemradio" type="button"><span class="language-region">CN</span><span>中文</span><svg class="language-check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
            <button class="language-option" data-language-option="en" role="menuitemradio" type="button"><span class="language-region">US</span><span>English</span><svg class="language-check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
          </div>
        </div>
        <button class="theme-toggle" data-theme-toggle data-theme-preference="auto" type="button" aria-label="切换到深色模式">
          <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.5A8.5 8.5 0 0 1 8.5 3.6 8.5 8.5 0 1 0 20.4 15.5Z"/></svg>
          <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
          <span class="theme-auto-mark" aria-hidden="true">A</span>
        </button>
        <button id="refreshBtn" class="round-icon-btn" data-i18n-title="refreshNow" aria-label="Refresh now">↻</button>
        <button id="openOptions" class="round-icon-btn settings-glyph" data-i18n-title="settings" aria-label="Settings">⚙</button>
      </div>
    </header>

    <section id="providers" class="balance-cards"></section>
    <section id="emptyState" class="empty-state popup-empty hidden">
      <div class="empty-state-icon">＋</div>
      <strong data-i18n="noSites">No monitored sites yet</strong>
      <span data-i18n="emptySiteHint">Add your first OneAPI/New API or DeepSeek site.</span>
      <button id="openOptionsEmpty" class="primary-btn" data-i18n="addSite">Add site</button>
    </section>

    <button id="refreshWide" class="popup-refresh-wide"><span class="refresh-glyph">↻</span><span data-i18n="refreshNow">Refresh now</span></button>

    <footer class="popup-footer">
      <span class="health-dot"></span>
      <span id="statusText" data-i18n="allNormal">All normal</span>
      <span class="footer-spacer"></span>
      <span id="lastUpdated" data-i18n="notRefreshed">Not refreshed yet</span>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
